<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--navy:#0A2558;--gold:#D4AC0D;--bg:#f0f2f5;--card:#fff;--bd:#e5e7eb;--txt:#1a1a1a;--sub:#888}
body{font-family:"Noto Sans",sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden}
.hdr{background:var(--navy);padding:10px 14px 8px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hdr-title{color:var(--gold);font-size:15px;font-weight:700}
.hdr-sub{color:rgba(255,255,255,.45);font-size:9px;margin-top:1px}
.lang-btn{background:rgba(255,255,255,.15);border:none;border-radius:18px;padding:5px 10px;display:flex;align-items:center;gap:5px;cursor:pointer;color:#fff;font-size:12px;font-family:inherit}
.srch{background:rgba(255,255,255,.12);border:none;border-radius:20px;padding:7px 14px;color:#fff;font-size:13px;font-family:inherit;outline:none;width:100%}
.srch::placeholder{color:rgba(255,255,255,.4)}
.locbar{background:#fff;border-bottom:1px solid var(--bd);padding:7px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.locbar::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:10.5px;cursor:pointer;white-space:nowrap;opacity:.55;color:#fff;border:none;font-family:inherit}
.chip.on{opacity:1}
.wrap{padding:10px;max-width:480px;margin:0 auto}
.shdr{display:flex;align-items:center;gap:8px;padding:10px 4px 6px}
.sicon{font-size:17px}
.smain{font-size:13px;font-weight:700;color:var(--txt)}
.scnt{font-size:10px;color:#bbb;margin-left:auto}
.pair{background:var(--card);border-radius:12px;border:1px solid var(--bd);margin-bottom:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.psec{padding:10px 12px 8px}
.ptop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pnum{width:22px;height:22px;border-radius:50%;background:var(--navy);color:var(--gold);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.plbl{font-size:8.5px;color:#bbb;margin-left:auto;text-transform:uppercase;letter-spacing:.3px}
.mphrase{font-size:16px;font-weight:700;color:var(--txt);text-align:center;line-height:1.5;margin-bottom:8px;padding:0 4px}
.mphrase.rtl{direction:rtl;font-family:"Noto Sans Arabic",sans-serif}
.mreply{font-size:14px;font-weight:700;color:#0a3d62;text-align:center;line-height:1.5;margin-bottom:8px;padding:0 4px}
.mreply.rtl{direction:rtl;font-family:"Noto Sans Arabic",sans-serif}
.lgrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.lc{border-radius:8px;padding:6px 7px 5px;position:relative;min-height:50px}
.lctop{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.lflag{width:18px;height:12px;border-radius:1.5px;overflow:hidden;display:inline-flex;flex-shrink:0}
.lflag svg{width:18px;height:12px;display:block}
.lcode{font-size:8px;font-weight:700}
.ltxt{font-size:10px;color:var(--txt);line-height:1.4;padding-bottom:14px;word-break:break-word}
.spk{background:none;border:none;cursor:pointer;padding:2px 3px;color:#ccc;position:absolute;bottom:4px;right:5px;border-radius:4px;display:flex;align-items:center}
.spk.playing{color:var(--gold)}
.divrow{display:flex;align-items:center;gap:8px;padding:4px 12px}
.divline{flex:1;height:1px;background:var(--bd)}
.divlbl{font-size:9px;color:#bbb;text-transform:uppercase;letter-spacing:.3px}
.rsec{background:#f7f9ff;border-top:1px solid var(--bd);padding:8px 12px 8px}
.lc.en{background:#f0f5ff}.lc.fr{background:#fff5f0}.lc.es{background:#f0fff5}
.lc.de{background:#fff8f0}.lc.ar{background:#f5f0ff}.lc.pl{background:#fff0f5}
.lc.ru{background:#f0f8ff}.lc.tr{background:#fff5f5}.lc.it{background:#f5fff0}
.lc.bs{background:#f0f5f5}.lc.hr{background:#f5f0f0}.lc.pt{background:#f0fff8}
.lc.da{background:#fff0f0}.lc.cs{background:#f0f0ff}
.rsec .lc.en{background:#e8f5e8}.rsec .lc.fr{background:#f0e8f8}
.rsec .lc.es{background:#fff3e0}.rsec .lc.de{background:#fdf5e8}
.rsec .lc.ar{background:#e8f0f8}.rsec .lc.ru{background:#e8f0ff}
.lcode.en{color:#1a3a6b}.lcode.fr{color:#8b3000}.lcode.es{color:#1a5c2e}
.lcode.de{color:#6b4400}.lcode.ar{color:#4a1a6b}.lcode.pl{color:#8b001a}
.lcode.ru{color:#1a3a6b}.lcode.tr{color:#8b0000}.lcode.it{color:#1a6b1a}
.lcode.bs{color:#1a4a4a}.lcode.hr{color:#6b1a1a}.lcode.pt{color:#1a6b4a}
.lcode.da{color:#8b1a1a}.lcode.cs{color:#1a1a8b}
.bsp{height:62px}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--bd);display:grid;grid-template-columns:1fr 1fr 1fr;z-index:200;padding:6px 0 env(safe-area-inset-bottom,8px)}
.bni{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border:none;background:none;padding:4px 0;font-family:inherit}
.bni .ico{font-size:20px;color:#bbb}
.bni span{font-size:9px;color:#bbb}
.bni.on .ico,.bni.on span{color:var(--navy)}
.empty{text-align:center;padding:40px 20px;color:#bbb;font-size:13px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500}
.modal-bg.show{display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;padding:0 0 20px}
.mhdr{background:var(--navy);padding:14px 18px 12px;border-radius:20px 20px 0 0;position:sticky;top:0}
.mtitle{color:var(--gold);font-size:14px;font-weight:700}
.msub{color:rgba(255,255,255,.5);font-size:10px;margin-top:2px}
.mclose{position:absolute;top:12px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.llist{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.litem{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;cursor:pointer;border:1px solid var(--bd)}
.litem.active{background:var(--navy);border-color:var(--navy)}
.lflag2{font-size:20px;line-height:1}
.lname{font-size:13px;font-weight:700;color:var(--txt)}
.len{font-size:10px;color:var(--sub)}
.litem.active .lname,.litem.active .len{color:#fff}
.litem.active .len{color:rgba(255,255,255,.6)}
.lchk{color:var(--gold);font-size:16px;display:none;margin-left:auto}
.litem.active .lchk{display:block}
</style>
</head>

</div>

document.getElementById('modalBg').onclick=function(e){ if(e.target===this) closeModal(); };
document.getElementById('si').oninput=function(){ q=this.value; render(); };
document.getElementById('bn0').onclick=function(){ setTab(0); };
document.getElementById('bn1').onclick=function(){ setTab(1); document.getElementById('si').focus(); };
document.getElementById('bn2').onclick=function(){ setTab(2); };

function setTab(i){
  for(var j=0;j<3;j++) document.getElementById('bn'+j).classList.toggle('on',j===i);
}

function openModal(){
  var h='';
  Object.keys(LG).forEach(function(code){
    var l=LG[code];
    h+='<div class="litem'+(code===lang?' active':'')+'" data-code="'+code+'">';
    h+='<span class="lflag2">'+l.flag+'</span>';
    h+='<div style="flex:1"><div class="lname">'+l.name+'</div><div class="len">'+l.en+'</div></div>';
    h+='<span class="lchk">✓</span>';
    h+='</div>';
  });
  document.getElementById('llist').innerHTML=h;
  document.querySelectorAll('.litem').forEach(function(el){
    el.onclick=function(){ setLang(this.getAttribute('data-code')); closeModal(); };
  });
  document.getElementById('modalBg').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
  document.body.style.overflow='';
}

function setLang(code){
  lang=code;
  var l=LG[code]; var lb=LB[code];
  document.getElementById('curFlag').textContent=l.flag;
  document.getElementById('curCode').textContent=code.toUpperCase();
  document.getElementById('si').placeholder=lb.search;
  document.getElementById('bn0t').textContent=lb.phrases;
  document.getElementById('bn1t').textContent=lb.search_tab;
  document.getElementById('bn2t').textContent=lb.places;
  document.documentElement.setAttribute('dir',l.dir==='rtl'?'rtl':'ltr');
  buildLocBar();
  render();
}

function buildLocBar(){
  var lb=LB[lang];
  var locs=['','Airport','Hotel','Restaurant','Mall','Clinic / Hospital','City Street','Bank','Museum / Park','City / Public Space','Various Locations'];
  var h='';
  locs.forEach(function(l){
    var bg=l?LC[l]:'var(--navy)';
    var label=l?(LI[l]+' '+l):lb.all;
    h+='<button class="chip'+(l===loc?' on':'')+'" style="background:'+bg+'" data-loc="'+encodeURIComponent(l)+'">'+label+'</button>';
  });
  document.getElementById('locBar').innerHTML=h;
  document.querySelectorAll('.chip').forEach(function(el){
    el.onclick=function(){
      loc=decodeURIComponent(this.getAttribute('data-loc'));
      document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
      this.classList.add('on');
      render();
    };
  });
}

function render(){
  var lb=LB[lang];
  var sup=SP[lang]||['en','fr','es'];
  var rtl=LG[lang].dir==='rtl';
  var qq=q.toLowerCase();
  var fil=D.filter(function(p){
    if(loc&&p.loc!==loc) return false;
    if(qq){
      var ok=(p.p[lang]||'').toLowerCase().includes(qq)||(p.r[lang]||'').toLowerCase().includes(qq)||(p.p.en||'').toLowerCase().includes(qq);
      if(!ok) return false;
    }
    return true;
  });
  if(!fil.length){ document.getElementById('main').innerHTML='<div class="empty">No results found</div>'; return; }
  var html=''; var ll='';
  fil.forEach(function(p){
    if(p.loc!==ll){
      var cnt=fil.filter(function(x){ return x.loc===p.loc; }).length;
      html+='<div class="shdr"><span class="sicon">'+(LI[p.loc]||'')+'</span><span class="smain">'+p.loc+'</span><span class="scnt">'+cnt+' '+lb.phrases+'</span></div>';
      ll=p.loc;
    }
    html+=buildPair(p,lb,sup,rtl);
  });
  document.getElementById('main').innerHTML=html;
  document.querySelectorAll('.spk').forEach(function(btn){
    btn.onclick=function(){ playAudio(this.getAttribute('data-u'),this); };
  });
}

function buildPair(p,lb,sup,rtl){
  var mp=p.p[lang]||''; var mr=p.r[lang]||'';
  var rc=rtl?' rtl':'';
  var h='<div class="pair"><div class="psec">';
  h+='<div class="ptop"><div class="pnum">'+p.num+'</div><div class="plbl">'+lb.phrase+'</div></div>';
  h+='<div class="mphrase'+rc+'">'+mp+'</div>';
  h+='<div class="lgrow">';
  sup.forEach(function(code){ h+=buildCard(code,p.p[code]||'',p.au?p.au[code]:''); });
  h+='</div></div>';
  if(mr){
    h+='<div class="divrow"><div class="divline"></div><span class="divlbl">'+lb.reply+'</span><div class="divline"></div></div>';
    h+='<div class="rsec"><div class="mreply'+rc+'">'+mr+'</div><div class="lgrow">';
    sup.forEach(function(code){ h+=buildCard(code,p.r[code]||'',p.ra?p.ra[code]:''); });
    h+='</div></div>';
  }
  return h+'</div>';
}

function buildCard(code,text,url){
  var spk=url?('<button class="spk" data-u="'+url+'">'+SVG+'</button>'):'';
  return '<div class="lc '+code+'"><div class="lctop"><span class="lflag">'+FL[code]+'</span><span class="lcode '+code+'">'+code.toUpperCase()+'</span></div><div class="ltxt">'+text+'</div>'+spk+'</div>';
}

buildLocBar();
render();
</script>
</body>
</html>
